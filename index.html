function haversineKm(a,b){if(a.lat==null||a.lon==null||b.lat==null||b.lon==null)return Infinity;const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLon=toRad(b.lon-a.lon),la1=toRad(a.lat),la2=toRad(b.lat);const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function routeKm(stops){let km=0;if(stops.length<2)return 0;for(let i=1;i<stops.length;i++){const d=haversineKm(stops[i-1],stops[i]);if(!Number.isFinite(d))return null;km+=d}return km}
function optimizeStops(){const r=curRun();if(!r)return;if(r.stops.length<2)return toast('Add at least two stops');if(r.stops.some(s=>s.lat==null||s.lon==null))return toast('Safe stop: at least one address has no coordinates. DOA/device order was preserved.',3200);const left=[...r.stops],out=[left.shift()];while(left.length){const a=out[out.length-1];let bi=0,bd=Infinity;left.forEach((b,i)=>{const d=haversineKm(a,b);if(d<bd){bd=d;bi=i}});out.push(left.splice(bi,1)[0])}out.forEach((s,i)=>s.order=i);updateRun(run=>event({...run,stops:out,optimization:{method:'straight-line-test',lastAt:nowIso()}},'test_optimized',{count:out.length}));toast('Test optimizer applied. This is still not road-routing.')}
function resetBaseline(){const r=curRun();if(!r)return;const out=[...r.stops].sort((a,b)=>(a.sourceOrder??999999)-(b.sourceOrder??999999));out.forEach((s,i)=>s.order=i);updateRun(run=>event({...run,stops:out,optimization:{method:'none',lastAt:null}},'baseline_restored'));toast('Original DOA/device order restored')}
function moveStop(i,d){const r=curRun();if(!r)return;const t=i+d;if(t<0||t>=r.stops.length)return;const a=[...r.stops];[a[i],a[t]]=[a[t],a[i]];a.forEach((s,n)=>s.order=n);updateRun(run=>event({...run,stops:a},'manual_reorder',{from:i,to:t}))}
function startDelivery(){const r=curRun();if(!r?.stops.length)return toast('No stops loaded');updateRun(run=>event({...run,status:'active',startedAt:run.startedAt||nowIso()},'delivery_started'),false);view='deliver';render()}
function markStop(status){const r=curRun();if(!r)return;let i=r.stops.findIndex((s,n)=>n>=r.activeIndex&&s.status==='pending');if(i<0)i=r.stops.findIndex(s=>s.status==='pending');if(i<0)return;const at=nowIso();updateRun(run=>{const stops=run.stops.map((s,n)=>n===i?{...s,status,deliveredAt:status==='delivered'?at:s.deliveredAt}:s);let next=stops.findIndex((s,n)=>n>i&&s.status==='pending');let first=stops.findIndex(s=>s.status==='pending'),all=first<0;return event({...run,stops,activeIndex:all?i:(next>=0?next:first),status:all?'completed':run.status,completedAt:all?at:run.completedAt},status,{stopId:run.stops[i].id,address:run.stops[i].address})})}
function progressForRun(r){if(!r?.stops.length)return 0;return Math.round(100*r.stops.filter(s=>s.status!=='pending').length/r.stops.length)}
function sourceLabel(s){return({device:'DEVICE',google_maps:'GOOGLE MAPS',manual:'MANUAL',legacy:'LEGACY'}[s.source]||String(s.source||'STOP').toUpperCase())}
function jobReady(r){return !!(r?.jobSheet&&(r.jobSheet.area||r.jobSheet.jobPool||r.jobSheet.jobs.length||r.scans.some(s=>s.kind==='paper')))}function addressReady(r){return !!r?.stops.length}function coordsReadyCount(r){return r?r.stops.filter(s=>s.lat!=null&&s.lon!=null).length:0}

function photoListHtml(r,group){const scans=r.scans.filter(s=>group==='paper'?s.kind==='paper':s.kind==='device-list'||s.kind==='device-stop');if(!scans.length)return'';return `<div class="list" style="margin-top:9px">${scans.map(s=>`<div class="photoRow"><div data-photo-id="${s.id}" class="photoIcon">${s.kind==='paper'?'▤':s.kind==='device-list'?'≡':'⌖'}</div><div class="grow"><div class="item-title">${s.kind==='paper'?'Paper page':s.kind==='device-list'?'Device address list':'Device stop detail'}</div><div class="item-meta">${esc(s.name||'photo')} · ${Math.round((s.size||0)/1024)} KB · ${s.persisted?'saved locally':'session only'}</div></div><button class="btn ghost" data-remove-photo="${s.id}">✕</button></div>`).join('')}</div>`}
function stopHtml(s,i,n){const deliveryCount=s.deliveries?.length||0;return `<div class="item"><div class="stopline"><div class="stopnum">${i+1}</div><div class="grow"><div class="item-title">${esc(s.address)}</div><div class="item-meta">${esc(s.items||'No delivery detail yet')}${s.jobId?' · Job '+esc(s.jobId):''}${s.tourId?' · Tour '+esc(s.tourId):''} · ${s.lat==null?'unresolved':'coordinates ready'}</div><span class="sourceTag">${esc(sourceLabel(s))}${deliveryCount?' · '+deliveryCount+' deliveries':''}</span></div><div class="actions"><button class="mini" data-up="${i}" ${i===0?'disabled':''}>↑</button><button class="mini" data-down="${i}" ${i===n-1?'disabled':''}>↓</button></div></div></div>`}
function deliverView(){const r=curRun();if(!r?.stops.length)return `<div class="empty">No active route.<br><br><button class="btn" id="openPrep">Open preparation</button></div>`;if(r.status==='completed'){const d=r.stops.filter(s=>s.status==='delivered').length,p=r.stops.filter(s=>s.status==='problem').length,k=r.stops.filter(s=>s.status==='skipped').length,dur=r.startedAt&&r.completedAt?Math.round((new Date(r.completedAt)-new Date(r.startedAt))/60000):null;return `<section class="card" style="text-align:center;margin-top:12vh"><div style="font-size:52px;color:var(--good)">✓</div><div class="headline">Route complete</div><div class="muted">${d} delivered · ${p} problems · ${k} skipped${dur!=null?' · '+dur+' min':''}</div><button class="btn block" id="reviewRoute" style="margin-top:14px">Route review</button></section>`}let idx=r.stops.findIndex((s,n)=>n>=r.activeIndex&&s.status==='pending');if(idx<0)idx=r.stops.findIndex(s=>s.status==='pending');const s=r.stops[idx];if(!s)return'';const details=(s.deliveries&&s.deliveries.length)?s.deliveries.map(d=>`<div class="delivery-item"><strong>${esc([d.product,d.code].filter(Boolean).join(' - ')||'Delivery')}</strong><small>${esc(d.recipient||d.name||'')} ${d.quantity?'· ×'+esc(d.quantity):''}</small></div>`).join(''):`<div class="delivery-item"><strong>${esc(s.items||'See DOA device for exact items')}</strong><small>${s.jobId?'Job '+esc(s.jobId):''}${s.tourId?' · Tour '+esc(s.tourId):''}</small></div>`;return `<section class="delivery"><div class="deliveryTop"><span>STOP ${idx+1} / ${r.stops.length}</span><strong>${esc(curRoute()?.name||'')}</strong></div><div><div class="eyebrow">CURRENT ADDRESS</div><div class="delivery-address">${esc(s.address)}</div><div class="delivery-sub">${esc([s.postalCode,s.city].filter(Boolean).join(' '))}</div></div><div class="delivery-items">${details}</div><div class="deliver-spacer"></div><button class="deliver-btn" data-mark="delivered">✓ DELIVERED</button><div class="minor"><button class=" function importDeviceList(replace){const addresses=splitAddressLines($('#deviceList').value);if(!addresses.length)return toast('No addresses found');const n=mergeStops(addresses,'device',replace);toast(n+' device addresses '+(replace?'loaded':'added'))}
function importMaps(replace){const raw=$('#mapsLink').value.trim(),parsed=parseGoogleMapsRoute(raw);updateRun(run=>({...run,mapsImport:{raw,type:parsed.type,importedAt:nowIso(),decodedStops:parsed.addresses.length,note:parsed.notes||''}}),false);if(parsed.shortLink){render();return toast('Short Google Maps link detected. Full route expansion still needs investigation.',3200)}if(!parsed.addresses.length){render();return toast('No route points could be decoded from that link',3000)}const n=mergeStops(parsed.addresses,'google_maps',replace);toast(n+' Google Maps route points '+(replace?'loaded':'added'))}
function manualImport(){const text=$('#manualImport').value;try{const stops=parseManualCsv(text);if(!stops.length)return toast('No valid stops found');updateRun(run=>event({...run,stops:stops.map((s,i)=>({...s,order:i,sourceOrder:i})),activeIndex:0,status:'draft',optimization:{method:'none',lastAt:null}},'manual_import',{count:stops.length}));toast(stops.length+' stops imported')}catch(e){toast(e.message||'Import failed')}}
function testGps(){const el=$('#gpsState');if(!navigator.geolocation){el.textContent='GPS unavailable in this browser.';return}el.textContent='Requesting permission…';navigator.geolocation.getCurrentPosition(p=>{el.textContent='GPS ready · accuracy about '+Math.round(p.coords.accuracy)+' m';toast('GPS permission works')},e=>{el.textContent='GPS blocked/unavailable · '+e.message;toast('GPS test failed')},{enableHighAccuracy:true,timeout:12000,maximumAge:0})}
async function openPhotoDb(){if(photoDb)return photoDb;if(!('indexedDB'in window))return null;photoDb=await new Promise(res=>{const q=indexedDB.open(PHOTO_DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(PHOTO_STORE))q.result.createObjectStore(PHOTO_STORE,{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});return photoDb}
async function addPhoto(file,kind){if(!file||!curRun())return;const id=uid('scan'),db=await openPhotoDb();let persisted=false;if(db)persisted=await new Promise(res=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).put({id,blob:file,name:file.name,type:file.type,size:file.size,kind,createdAt:nowIso()});tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)});sessionPhotos.set(id,URL.createObjectURL(file));updateRun(run=>event({...run,scans:[...run.scans,{id,kind,name:file.name,size:file.size,type:file.type,persisted,createdAt:nowIso()}]},'scan_added',{kind}),false);render();toast(persisted?'Photo saved locally':'Photo selected; persistent photo storage blocked')}
async function removePhoto(id){const db=await openPhotoDb();if(db)await new Promise(res=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).delete(id);tx.oncomplete=tx.onerror=()=>res()});if(sessionPhotos.has(id)){URL.revokeObjectURL(sessionPhotos.get(id));sessionPhotos.delete(id)}updateRun(run=>({...run,scans:run.scans.filter(s=>s.id!==id)}));toast('Photo removed')}
async function getPhoto(id){if(sessionPhotos.has(id))return sessionPhotos.get(id);const db=await openPhotoDb();if(!db)return null;const rec=await new Promise(res=>{const q=db.transaction(PHOTO_STORE,'readonly').objectStore(PHOTO_STORE).get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)});if(!rec?.blob)return null;const url=URL.createObjectURL(rec.blob);sessionPhotos.set(id,url);return url}
async function hydratePhotos(){for(const el of $$('[data-photo-id]')){const id=el.dataset.photoId,url=await getPhoto(id);if(url){el.innerHTML=`<img class="photo-thumb" src="${url}" alt="Captured document">`;el.style.width='74px';el.style.height='74px';el.style.background='transparent'}}}
function navigateCurrent(){const r=curRun();if(!r)return;let idx=r.stops.findIndex((s,n)=>n>=r.activeIndex&&s.status==='pending');if(idx<0)idx=r.stops.findIndex(s=>s.status==='pending');const s=r.stops[idx];if(!s)return;const q=encodeURIComponent([s.address,s.postalCode,s.city].filter(Boolean).join(' '));window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener')}
function exportBackup(){const payload={format:'DeliveryRouteAssistantBackup',version:VERSION,exportedAt:nowIso(),privacyNote:'Photo blobs are excluded; metadata only.',state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='DeliveryRouteAssistant-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restoreBackup(file){if(!file)return;try{const parsed=JSON.parse(await file.text()),next=ensureStateShape(parsed.state||parsed);if(!Array.isArray(next.routes)||!Array.isArray(next.runs))throw Error('Invalid backup');state=next;saveState();toast('Backup restored');render()}catch{toast('Backup could not be restored')}}
async function privacyCleanup(){const completed=state.runs.filter(r=>r.status==='completed');if(!completed.length)return toast('No completed runs to clean');if(!confirm('Remove captured photos, raw Maps links and recipient-level detail from completed runs while keeping route/timing history?'))return;const db=await openPhotoDb();for(const r of completed){for(const s of r.scans){if(db)await new Promise(res=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).delete(s.id);tx.oncomplete=tx.onerror=()=>res()})}r.scans=[];r.mapsImport={raw:'',type:r.mapsImport?.type||'none',importedAt:r.mapsImport?.importedAt||null,decodedStops:r.mapsImport?.decodedStops||0,note:'raw link purged'};r.stops=r.stops.map(s=>({...s,deliveries:(s.deliveries||[]).map(d=>({product:d.product||'',quantity:d.quantity||null})),items:s.items?String(s.items).slice(0,80):''}));event(r,'privacy_cleanup')}saveState();render();toast('Completed-run sensitive details cleaned')}
async function clearAllData(){if(!confirm('Clear ALL local routes, runs and captured photos from this browser?'))return;const db=await openPhotoDb();if(db)await new Promise(res=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).clear();tx.oncomplete=tx.onerror=()=>res()});state=defaultState();saveState();sessionPhotos.forEach(u=>URL.revokeObjectURL(u));sessionPhotos.clear();view='home';render();toast('All local app data cleared')}
function runSelfTests(){const tests=[];const assert=(name,ok)=>tests.push({name,ok:!!ok});try{assert('Job list parser',JSON.stringify(parseJobs('49031, 49080; 49112'))===JSON.stringify(['49031','49080','49112']));const p=parseProducts('BERL,7,0,7,50');assert('Product table parser',p.length===1&&p[0].bundleSize===50);assert('Device list de-duplicates overlap',splitAddressLines('A Street 1\nB Street 2\nB Street 2\nC Street 3').length===3);const m1=parseGoogleMapsRoute('https://www.google.com/maps/dir/?api=1&origin=A+Street+1&destination=C+Street+3&waypoints=B+Street+2');assert('Google Maps API=1 parser',m1.addresses.length===3);const m2=parseGoogleMapsRoute('https://www.google.com/maps/dir/A%20Street%201/B%20Street%202/C%20Street%203');assert('Google Maps /dir path parser',m2.addresses.length===3);const unresolved=[stopFromAddress('A','manual',0),stopFromAddress('B','manual',1)];assert('Unresolved stops remain unresolved',unresolved.every(s=>s.lat==null));const a=stopFromAddress('55.67, 12.56','manual',0),b=stopFromAddress('55.68, 12.57','manual',1);assert('Coordinate parser',a.lat!=null&&b.lon!=null&&Number.isFinite(haversineKm(a,b)));const backup=JSON.stringify({state});assert('Backup serializable',backup.length>20)}catch(e){tests.push({name:'Unexpected test exception',ok:false})}const pass=tests.filter(t=>t.ok).length,res=$('#testResult');res.className='status '+(pass===tests.length?'good':'bad');res.innerHTML=`<strong>${pass}/${tests.length} self-tests passed</strong>`+tests.map(t=>`${t.ok?'✓':'✕'} ${esc(t.name)}`).join('<br>');toast(pass+'/'+tests.length+' self-tests passed')}
$('#cameraInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(f){if(captureKind==='camera-test'){toast('Camera/photo picker works — test photo was not saved');captureKind='paper'}else addPhoto(f,captureKind)}e.target.value=''});$('#backupInput').addEventListener('change',e=>{restoreBackup(e.target.files?.[0]);e.target.value=''});
window.addEventListener('online',()=>render());window.addEventListener('offline',()=>render());
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();
</script>
